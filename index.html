<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unwrap your Christmas wishes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--night:#14213d;--deep:#0b1426;--snow:#f1f5f9;--red:#d62839;--gold:#f4b942;--pine:#2a9d6f;--muted:#9fb0cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--night:#14213d;--deep:#0b1426}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--deep);color:var(--snow);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:720px}
h1{font:16px/1.5 "Press Start 2P",monospace;margin:4px 0 14px;text-align:center;color:var(--gold)}
.stage{position:relative;border:4px solid var(--snow);border-radius:4px;background:var(--night);line-height:0}
canvas{width:100%;height:auto;image-rendering:pixelated;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,20,38,.82);line-height:1.5;text-align:center;padding:16px}
.overlay p{margin:0;max-width:32ch;font-size:16px}
button{font:12px/1.4 "Press Start 2P",monospace;background:var(--red);color:var(--snow);border:0;border-bottom:4px solid #8f1a26;padding:12px 18px;border-radius:4px;cursor:pointer}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{margin-top:14px;background:var(--snow);color:var(--night);border-radius:6px;padding:16px 18px;min-height:96px}
.card p{margin:0;font-size:19px;line-height:1.45;max-width:60ch}
.pips{display:flex;gap:8px;margin-bottom:10px}
.pips i{width:14px;height:14px;border-radius:3px;background:#c4cedd}
.pips i.on{background:var(--red)}
.wishes p+p{margin-top:10px;padding-top:10px;border-top:1px solid #c4cedd;font-size:17px}
.card button{margin-top:14px}
.pad{display:none;justify-content:space-between;margin-top:14px;gap:10px}
.pad button{flex:1;font-size:18px;padding:16px 0;touch-action:none;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.pad{display:flex}}
.bubble{position:absolute;z-index:3;background:var(--snow);color:var(--night);font-size:15px;line-height:1.35;padding:10px 12px;border-radius:8px;border:3px solid var(--gold);pointer-events:none;transition:opacity .4s;animation:pop .25s ease-out}
.bubble::after{content:"";position:absolute;left:var(--t);bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--gold);border-bottom:0}
.bubble.below::after{bottom:auto;top:-11px;border-top:0;border-bottom:8px solid var(--gold)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}
@media (max-width:480px){.bubble{font-size:13px;padding:8px 10px}}
.overlay{justify-content:flex-start}
.overlay>:first-child{margin-top:auto}
.overlay>:last-child{margin-bottom:auto}
.overlay .hint{font-size:13px;color:var(--muted)}
.lang{display:flex;gap:8px}
.lang button{font-size:10px;padding:8px 12px;background:#33415f;border-bottom-color:#1d2740}
.lang button.on{background:var(--red);border-bottom-color:#8f1a26}
#nick{font:16px system-ui,sans-serif;padding:10px 12px;border-radius:4px;border:3px solid var(--snow);background:var(--deep);color:var(--snow);width:min(260px,80%);text-align:center}
#lb{margin-top:12px}
#lb h3{margin:0;font-size:16px}
.lb{list-style:none;margin:6px 0 0;padding:0}
.lb li{display:flex;gap:10px;padding:5px 8px;border-radius:4px;font-size:16px}
.lb li span:first-child{width:2.2ch;text-align:right}
.lb li span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li.me{background:var(--gold)}
.card .score{font-size:17px;margin-top:6px}
.card .note{font-size:13px;color:#5a6785;margin-top:6px}
@media (max-width:480px){.overlay p{font-size:13px}.overlay{gap:8px;padding:10px}}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
@media (max-width:480px){h1{font-size:12px}.card p{font-size:17px}}
</style>
</head>
<body>
<main>
<h1 data-i="title">Unwrap your Christmas wishes</h1>
<div class="stage">
<canvas id="c" width="640" height="360" aria-label="Christmas brick game"></canvas>

<div class="lang"><button type="button" id="len">EN</button><button type="button" id="lde">DE</button></div>

</div>

</div>
<div class="pad"><button id="bl" aria-label="Move left">&#9664;</button><button id="bj" aria-label="Jump">Jump</button><button id="br" aria-label="Move right">&#9654;</button></div>

const cv=document.getElementById("c"),ctx=cv.getContext("2d"),stage=document.querySelector(".stage");
const W=640,H=360,G=300,S=34,T=60,PW=50,TH=52;
const intro=document.getElementById("intro"),out=document.getElementById("out"),pips=[...document.querySelectorAll("#pips i")];
let bricks=[],pits=[],foes=[],got=[],p,keys={l:0,r:0,j:0},running=false,over=false,lives=3,left=T,inv=0,acc=0,last=0,squashed=0,nick="",lang=(navigator.language||"en").slice(0,2)==="de"?"de":"en";
const snow=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2,v:.3+Math.random()*.7}));
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const I={
en:{title:"Unwrap your Christmas wishes",intro:"Bump your head into the five gift boxes to unwrap a wish. You have 3 chances and 60 seconds. Dodge icy gaps and snowmen, or jump on a snowman to squash it.",nick:"Your nickname",start:"Start",hint:"Arrow keys or A / D to move, Space to jump",foot:"Happy holidays from SafeDriver Group",goal:"Unwrap all five gifts before the clock runs out.",progress:n=>n+" of 5 wishes unwrapped.",win:"You unwrapped all five. Merry Christmas and a happy new year from all of us at SafeDriver Group.",time:"Time’s up!",out:"Out of chances!",count:n=>"You unwrapped "+n+" of 5 wishes.",score:"Score",lb:"Leaderboard",lbload:"Loading leaderboard…",lberr:"The leaderboard is not available right now.",local:"Scores are saved on this device only.",again:"Play again",retry:"Try again",anon:"Player",gifts:"Gifts"},
de:{title:"Pack deine Weihnachtswünsche aus",intro:"Stoß mit dem Kopf gegen die fünf Geschenkboxen und pack einen Wunsch aus. Du hast 3 Chancen und 60 Sekunden. Weiche eisigen Lücken und Schneemännern aus oder spring auf einen Schneemann, um ihn zu plätten.",nick:"Dein Spitzname",start:"Start",hint:"Pfeiltasten oder A / D zum Laufen, Leertaste zum Springen",foot:"Frohe Feiertage von der SafeDriver Group",goal:"Pack alle fünf Geschenke aus, bevor die Zeit abläuft.",progress:n=>n+" von 5 Wünschen ausgepackt.",win:"Du hast alle fünf ausgepackt. Frohe Weihnachten und ein gutes neues Jahr von uns allen bei der SafeDriver Group.",time:"Die Zeit ist um!",out:"Keine Chancen mehr!",count:n=>"Du hast "+n+" von 5 Wünschen ausgepackt.",score:"Punkte",lb:"Bestenliste",lbload:"Bestenliste wird geladen…",lberr:"Die Bestenliste ist gerade nicht verfügbar.",local:"Punkte werden nur auf diesem Gerät gespeichert.",again:"Nochmal spielen",retry:"Nochmal versuchen",anon:"Spieler",gifts:"Geschenke"}};
const L=(k,a)=>{const v=I[lang][k];return typeof v==="function"?v(a):v};
const wish=i=>(lang==="de"?WISHES_DE:WISHES)[i];
function setLang(l){
  lang=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=L(e.dataset.i));
  nickEl.placeholder=L("nick");
  document.getElementById("len").classList.toggle("on",l==="en");
  document.getElementById("lde").classList.toggle("on",l==="de");
  if(!over)status();
}
function reset(){
  const pool=WISHES.map((_,i)=>i);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const a=170+Math.random()*60,c=390+Math.random()*60;
  pits=[{x:a,w:PW},{x:c,w:PW}];
  bricks=pool.slice(0,5).map((t,i)=>({x:40+i*118+Math.random()*34,y:140+Math.random()*45,t,hit:false,bump:0,grow:0}));
  foes=[[100,a-34],[a+PW+10,c-34],[c+PW+10,W-30]].map(([l,r])=>({x:l+(r-l)*Math.random(),l,r,d:Math.random()<.5?-1:1,v:.7+Math.random()*.6,y:G-30,alive:true}));
  got=[];over=false;lives=3;left=T;inv=0;acc=0;squashed=0;
  p={x:20,y:G-34,w:22,h:34,vy:0,ground:true,face:1};
  stage.querySelectorAll(".bubble").forEach(e=>e.remove());
  status();
}
function status(){
  pips.forEach((e,i)=>e.classList.toggle("on",i<got.length));
  out.innerHTML="<p>"+(got.length?L("progress",got.length):L("goal"))+"</p>";
}
function bubble(b){
  if(!running)return;
  const e=document.createElement("div");e.className="bubble";e.textContent=wish(b.t);stage.appendChild(e);
  const sw=stage.clientWidth,sc=sw/W,w=Math.min(240,sw-16);
  e.style.width=w+"px";
  const cx=(b.x+S/2)*sc,l=clamp(cx-w/2,8,sw-w-8);
  e.style.left=l+"px";
  e.style.setProperty("--t",clamp(cx-l,14,w-14)+"px");
  const h=e.offsetHeight;
  const t0=(b.y-TH-8)*sc;if(h<=t0-4)e.style.top=(t0-h)+"px";
  else{e.style.top=((b.y+S)*sc+12)+"px";e.classList.add("below")}
  setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),400)},6500);
}
function hit(b){
  if(b.hit)return;
  b.hit=true;b.bump=8;got.push(b.t);
  pips.forEach((e,i)=>e.classList.toggle("on",i<got.length));
  status();
  setTimeout(()=>bubble(b),400);
  if(got.length===5){over=true;setTimeout(()=>end(true),3200)}
}
const LB_URL="";
const LK="sdg-xmas-lb";
const local=()=>{try{return JSON.parse(localStorage.getItem(LK))||[]}catch(e){return[]}};
const score=win=>got.length*100+lives*50+squashed*25+(win?Math.ceil(left)*3:0);
function renderLb(list,me){
  const box=document.getElementById("lb");
  if(!box)return;
  if(!list){box.innerHTML="<p>"+L("lberr")+"</p>";return}
  let done=false;
  box.innerHTML="<h3>"+L("lb")+"</h3><ol class=lb>"+list.slice(0,10).map((x,i)=>{
    const m=!done&&String(x.n)===me.n&&Number(x.s)===me.s;if(m)done=true;
    return "<li"+(m?" class=me":"")+"><span>"+(i+1)+".</span><span>"+esc(String(x.n))+"</span><b>"+(Number(x.s)||0)+"</b></li>";
  }).join("")+"</ol>"+(LB_URL?"":"<p class=note>"+L("local")+"</p>");
}
async function submit(sc){
  const me={n:nick,s:sc};let list;
  try{
    if(LB_URL){
      await fetch(LB_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(me)});
      list=await(await fetch(LB_URL)).json();
    }else{
      list=local();list.push(me);list.sort((a,b)=>b.s-a.s);list=list.slice(0,50);
      try{localStorage.setItem(LK,JSON.stringify(list))}catch(e){}
    }
  }catch(e){list=null}
  renderLb(list,me);
}
function end(win){
  running=false;
  stage.querySelectorAll(".bubble").forEach(e=>e.remove());
  const sc=score(win);
  const head=win?L("win"):L(left<=0?"time":"out")+" "+L("count",got.length);
  out.innerHTML=(got.length?'<div class="wishes">'+got.map(i=>"<p>"+esc(wish(i))+"</p>").join("")+"</div>":"")
    +'<p style="margin-top:14px;font-weight:600">'+head+'</p><p class="score">'+L("score")+": <b>"+sc+'</b></p><div id="lb"><p>'+L("lbload")+'</p></div><button id="again">'+L(win?"again":"retry")+"</button>";
  document.getElementById("again").onclick=()=>{reset();running=true};
  submit(sc);
}
function loseLife(){
  if(over)return false;
  lives--;inv=100;
  if(lives<=0){over=true;end(false);return false}
  return true;
}
function step(){
  if(!over){left-=1/60;if(left<=0){left=0;over=true;end(false);return}}
  if(inv>0)inv--;
  const pv=p.y,d=keys.r-keys.l;
  if(d)p.face=d;
  p.x=clamp(p.x+d*3.2,0,W-p.w);
  if(keys.j&&p.ground)p.vy=-11.5;
  p.vy+=.55;p.y+=p.vy;p.ground=false;
  const pit=pits.find(q=>p.x+p.w>q.x+6&&p.x<q.x+q.w-6);
  if(!pit&&p.y+p.h>=G){p.y=G-p.h;p.vy=0;p.ground=true}
  if(pit&&p.y+p.h>G+12){
    const q=pit;
    if(loseLife()){p.x=Math.max(0,q.x-36);p.y=G-p.h;p.vy=0}
    return;
  }
  for(const b of bricks){
    if(p.x+p.w>b.x+2&&p.x<b.x+S-2){
      if(p.vy<0&&pv>=b.y+S&&p.y<b.y+S){p.y=b.y+S;p.vy=1;hit(b)}
      else if(p.vy>=0&&pv+p.h<=b.y&&p.y+p.h>b.y){p.y=b.y-p.h;p.vy=0;p.ground=true}
    }
    if(b.bump>0)b.bump--;
    if(b.hit&&b.grow<1)b.grow=Math.min(1,b.grow+.04);
  }
  for(const f of foes){
    if(!f.alive)continue;
    f.x+=f.d*f.v;
    if(f.x<f.l){f.x=f.l;f.d=1}
    if(f.x>f.r){f.x=f.r;f.d=-1}
    if(p.x+p.w>f.x+3&&p.x<f.x+25&&p.y+p.h>f.y+4&&p.y<f.y+30){
      if(p.vy>0&&pv+p.h<=f.y+14){f.alive=false;squashed++;p.vy=-8}
      else if(inv<=0&&!over&&loseLife()){p.vy=-6;p.x=clamp(p.x+(p.x<f.x?-36:36),0,W-p.w)}
    }
  }
}
function R(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function snowman(f){
  const x=f.x,y=f.y;
  ctx.fillStyle="#f1f5f9";

function key(e,v){

  else if(k===" "||k==="ArrowUp"||k==="w"||k==="W")keys.j=v;

}
